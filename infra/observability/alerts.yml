groups:
  - name: ecommerce-platform
    rules:
      - alert: ServiceTargetDown
        expr: up{job=~"api-gateway|.*-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
      - alert: HighHTTPErrorRate
        expr: sum by (service) (rate(ecommerce_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum by (service) (rate(ecommerce_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has more than 5% HTTP 5xx responses"
      - alert: HighHTTPLatency
        expr: histogram_quantile(0.95, sum by (le, service) (rate(ecommerce_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency exceeds one second"
      - alert: NotificationDeliveryFailureRateHigh
        expr: sum(rate(notification_delivery_events_total{event="failed"}[10m])) / clamp_min(sum(rate(notification_delivery_events_total{event=~"sent|failed"}[10m])), 0.000001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification terminal delivery failures exceed 5%"
      - alert: NotificationWebhookProcessingFailures
        expr: sum(rate(notification_provider_webhooks_total{outcome="failed"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Notification provider webhooks cannot be persisted"
      - alert: NotificationProviderEventLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(notification_delivery_event_lag_seconds_bucket[10m]))) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Notification provider event ingestion p95 lag exceeds five minutes"
