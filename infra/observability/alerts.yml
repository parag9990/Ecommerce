groups:
  - name: ecommerce-platform
    rules:
      - alert: ServiceTargetDown
        expr: up{job=~"api-gateway|.*-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
      - alert: HighHTTPErrorRate
        expr: sum by (service) (rate(ecommerce_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum by (service) (rate(ecommerce_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has more than 5% HTTP 5xx responses"
      - alert: HighHTTPLatency
        expr: histogram_quantile(0.95, sum by (le, service) (rate(ecommerce_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} p95 latency exceeds one second"
