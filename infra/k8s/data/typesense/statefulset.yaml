apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: typesense
  namespace: data
  labels:
    app.kubernetes.io/name: typesense
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: search-engine
spec:
  serviceName: typesense-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: typesense
  template:
    metadata:
      labels:
        app.kubernetes.io/name: typesense
        app.kubernetes.io/part-of: ecommerce-platform
        app.kubernetes.io/component: search-engine
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: typesense
                topologyKey: kubernetes.io/hostname
      containers:
        - name: typesense
          image: typesense/typesense:27.1
          imagePullPolicy: IfNotPresent
          args:
            - "--data-dir=/data"
            - "--api-key=$(TYPESENSE_API_KEY)"
            - "--api-port=8108"
            - "--peering-port=8107"
            - "--peering-address=$(POD_NAME).typesense-headless.$(POD_NAMESPACE).svc.cluster.local"
            - "--nodes=/etc/typesense/nodes"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: typesense-secret
                  key: TYPESENSE_API_KEY
          ports:
            - name: api
              containerPort: 8108
            - name: peering
              containerPort: 8107
          volumeMounts:
            - name: data
              mountPath: /data
            - name: nodes
              mountPath: /etc/typesense
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: nodes
          configMap:
            name: typesense-nodes
            items:
              - key: nodes
                path: nodes
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: typesense
          app.kubernetes.io/part-of: ecommerce-platform
          app.kubernetes.io/component: search-engine
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
