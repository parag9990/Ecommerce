apiVersion: v1
kind: Secret
metadata:
  name: superadmin-service-secret
  namespace: core
  labels:
    app.kubernetes.io/name: superadmin-service
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  SUPERADMIN_DATABASE_DSN: superadmin_user:change-me@tcp(mysql.data.svc.cluster.local:3306)/superadmin_db?parseTime=true&multiStatements=true&charset=utf8mb4&loc=UTC
  USER_SERVICE_ADMIN_TOKEN: change-me-at-least-32-characters
  ORDER_SERVICE_ADMIN_TOKEN: change-me-at-least-32-characters
  PAYMENT_SERVICE_ADMIN_TOKEN: change-me-at-least-32-characters
  SESSION_SERVICE_ADMIN_TOKEN: change-me-at-least-32-characters
