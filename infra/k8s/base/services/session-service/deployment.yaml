apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: core
  labels:
    app.kubernetes.io/name: session-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: backend-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: session-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-service
        app.kubernetes.io/part-of: ecommerce-platform
        app.kubernetes.io/component: backend-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: session-service
          image: registry.example.com/ecommerce/session-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8086, protocol: TCP }
          envFrom:
            - configMapRef: { name: session-service-config }
            - secretRef: { name: session-service-secret }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 750m, memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
