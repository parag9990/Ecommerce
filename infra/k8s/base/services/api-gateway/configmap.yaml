apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: edge
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: api-gateway
data:
  SERVICE_NAME: api-gateway
  APP_ENV: dev
  HTTP_ADDR: :8080
  API_BASE_PATH: /api/v1
  API_CONTRACT_PATH: /app/config/master-api.json
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
  METRICS_ADDR: :9091
  TRACE_ENABLED: "true"
  TRACE_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317
  TRACE_EXPORTER_OTLP_INSECURE: "true"
  GRPC_WEB_ENABLED: "true"
  GRPC_ADDR: :9090
  GRPC_WEB_POLICY_PATH: /app/config/grpcweb-policies.json
  GRPC_WEB_EXPOSED_SERVICES: ecommerce.search.v1.SearchService,ecommerce.session.v1.SessionService,ecommerce.superadmin.v1.SuperadminService,ecommerce.cms.v1.CMSService
  GRPC_TLS_ENABLED: "false"
  GRPC_ALLOW_UNAVAILABLE_DOWNSTREAMS: "true"
  REDIS_ADDR: redis.data.svc.cluster.local:6379
  JWT_ISSUER: ecommerce-auth
  JWT_AUDIENCE: ecommerce-api
  JWT_ALLOWED_ALGS: RS256
  JWT_JWKS_URL: http://auth-service.core.svc.cluster.local:8081/.well-known/jwks.json
  AUTH_GRPC_ADDR: auth-service.core.svc.cluster.local:8081
  USER_GRPC_ADDR: user-service.core.svc.cluster.local:50052
  PRODUCT_GRPC_ADDR: product-service.core.svc.cluster.local:8082
  CART_GRPC_ADDR: cart-service.core.svc.cluster.local:8083
  WISHLIST_GRPC_ADDR: wishlist-service.core.svc.cluster.local:8084
  ORDER_GRPC_ADDR: order-service.core.svc.cluster.local:8090
  PAYMENT_GRPC_ADDR: payment-service.core.svc.cluster.local:8080
  SEARCH_GRPC_ADDR: search-service.core.svc.cluster.local:9085
  CMS_GRPC_ADDR: cms-service.core.svc.cluster.local:9098
  SESSION_GRPC_ADDR: session-service.core.svc.cluster.local:8086
  NOTIFICATION_GRPC_ADDR: notification-service.core.svc.cluster.local:9090
  SUPERADMIN_GRPC_ADDR: superadmin-service.core.svc.cluster.local:8088
