apiVersion: batch/v1
kind: CronJob
metadata:
  name: cart-expiry-cleanup
  namespace: core
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: expiry-worker
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cart-service
            app.kubernetes.io/component: expiry-worker
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: cart-expiry-worker
              image: registry.example.com/ecommerce/cart-service:dev
              imagePullPolicy: IfNotPresent
              command: ["/app/cart-expiry-worker"]
              envFrom:
                - configMapRef: { name: cart-service-config }
                - secretRef: { name: cart-service-secret }
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
