apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: core
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - { name: http, port: 8082, targetPort: http, protocol: TCP }
    - { name: grpc, port: 9092, targetPort: grpc, protocol: TCP }
