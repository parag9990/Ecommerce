apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: core
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: ecommerce-platform
data:
  SERVICE_NAME: auth-service
  APP_ENV: dev
  AUTH_HTTP_ADDR: :8081
  AUTH_HTTP_READ_TIMEOUT: 5s
  AUTH_HTTP_WRITE_TIMEOUT: 10s
  AUTH_HTTP_IDLE_TIMEOUT: 60s
  AUTH_SHUTDOWN_TIMEOUT: 10s
  AUTH_REDIS_ADDR: redis.data.svc.cluster.local:6379
  AUTH_REDIS_DB: "1"
  JWT_ISSUER: ecommerce-auth
  JWT_AUDIENCE: ecommerce-api
  JWT_ACCESS_TTL: 15m
  REFRESH_TOKEN_TTL: 720h
  JWT_CLOCK_SKEW: 30s
  JWT_SIGNING_ALG: RS256
  JWT_KEY_ID: auth-dev-1
  JWT_PRIVATE_KEY_PEM_PATH: /var/run/secrets/auth-jwt/private.pem
  JWT_PUBLIC_KEY_PEM_PATH: /var/run/secrets/auth-jwt/public.pem
  OTP_LENGTH: "6"
  OTP_TTL: 5m
  OTP_MAX_ATTEMPTS: "5"
  OTP_RESEND_COOLDOWN: 1m
  OTP_SEND_LIMIT_WINDOW: 15m
  OTP_SEND_LIMIT_PER_WINDOW: "3"
  OTP_DAILY_LIMIT: "10"
  NOTIFICATION_GRPC_ADDR: notification-service.core.svc.cluster.local:9090
  NOTIFICATION_TIMEOUT: 3s
  SESSION_LINK_MODE: outbox
  AUTH_EVENTS_TOPIC: auth.events
  SESSION_LINK_TIMEOUT: 150ms
  OUTBOX_WORKER_BATCH_SIZE: "100"
  OUTBOX_WORKER_INTERVAL: 1s
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_INITIAL_BACKOFF: 5s
  OUTBOX_MAX_BACKOFF: 10m
  OUTBOX_STALE_LOCK_TIMEOUT: 5m
