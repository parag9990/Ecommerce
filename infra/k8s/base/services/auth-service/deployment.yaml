apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: core
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: backend-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: ecommerce-platform
        app.kubernetes.io/component: backend-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: registry.example.com/ecommerce/auth-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081, protocol: TCP }
          envFrom:
            - configMapRef: { name: auth-service-config }
            - secretRef: { name: auth-service-secret }
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/run/secrets/auth-jwt
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: jwt-keys
          secret:
            secretName: auth-service-secret
            items:
              - { key: jwt-private.pem, path: private.pem }
              - { key: jwt-public.pem, path: public.pem }
