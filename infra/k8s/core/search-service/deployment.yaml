apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: core
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: backend-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-service
        app.kubernetes.io/part-of: ecommerce-platform
        app.kubernetes.io/component: backend-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-service
          image: search-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: search-service-config
            - secretRef:
                name: search-service-secret
          ports:
            - name: http
              containerPort: 8085
            - name: grpc
              containerPort: 9085
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-service
  namespace: core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service
  namespace: core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
