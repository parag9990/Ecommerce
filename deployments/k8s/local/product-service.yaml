apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce-local
  labels: { app.kubernetes.io/name: product-service, app.kubernetes.io/part-of: ecommerce }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: product-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: product-service, app.kubernetes.io/part-of: ecommerce }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: product-service
          image: ecommerce/product-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8082 }]
          env:
            - { name: PRODUCT_HTTP_ADDR, value: ":8082" }
            - { name: PRODUCT_MONGO_URI, value: "mongodb://mongodb:27017" }
            - { name: PRODUCT_MONGO_DATABASE, value: product_db }
            - { name: PRODUCT_EVENTS_ENABLED, value: "false" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: ecommerce-local }
spec:
  selector: { app.kubernetes.io/name: product-service }
  ports: [{ name: http, port: 8082, targetPort: http }]
