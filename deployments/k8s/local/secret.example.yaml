apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-local-secrets
  namespace: ecommerce-local
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: local_password
  MONGO_ROOT_PASSWORD: local_mongo_password
  REDIS_PASSWORD: local_redis_password
  TYPESENSE_API_KEY: local_typesense_key
  PAYMENT_INTERNAL_API_TOKEN: local_payment_internal_token_change_me_32_chars
