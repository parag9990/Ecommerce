apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-local-config
  namespace: ecommerce-local
data:
  SERVICE_NAME: api-gateway
  APP_ENV: local
  LOG_LEVEL: info
  HTTP_ADDR: :8080
  API_BASE_PATH: /api/v1
  API_CONTRACT_PATH: /app/config/master-api.json
  HTTP_READ_HEADER_TIMEOUT: 5s
  HTTP_SHUTDOWN_TIMEOUT: 10s
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:5173
  METRICS_ENABLED: "true"
  METRICS_ADDR: :9091
  TRACE_ENABLED: "false"
  TRACE_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  TRACE_EXPORTER_OTLP_INSECURE: "true"
  GRPC_WEB_ENABLED: "true"
  GRPC_ADDR: :9090
  GRPC_WEB_POLICY_PATH: /app/config/grpcweb-policies.json
  GRPC_WEB_EXPOSED_SERVICES: ecommerce.search.v1.SearchService,ecommerce.recommendation.v1.RecommendationService,ecommerce.session.v1.SessionService,ecommerce.superadmin.v1.SuperadminService,ecommerce.cms.v1.CMSService
  GRPC_WEB_MAX_RECEIVE_MESSAGE_BYTES: "4194304"
  GRPC_WEB_MAX_SEND_MESSAGE_BYTES: "4194304"
  GRPC_TLS_ENABLED: "false"
  GRPC_DIAL_TIMEOUT: 2s
  GRPC_ALLOW_UNAVAILABLE_DOWNSTREAMS: "true"
  RATE_LIMIT_ENABLED: "false"
  REDIS_ADDR: redis:6379
  MONGO_HOST: mongodb
  MYSQL_HOST: mysql
  KAFKA_BROKERS: kafka:29092
  RABBITMQ_HOST: rabbitmq
  TYPESENSE_HOST: typesense
  JWT_ISSUER: ecommerce-auth
  JWT_AUDIENCE: ecommerce-api
  JWT_ALLOWED_ALGS: RS256
  JWT_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
  AUTH_GRPC_ADDR: auth-service:8081
  AUTH_HTTP_URL: http://auth-service:8081
  AUTH_HTTP_TIMEOUT: 10s
  USER_GRPC_ADDR: user-service:50052
  PRODUCT_GRPC_ADDR: product-service:9092
  PRODUCT_HTTP_URL: http://product-service:8082
  PRODUCT_HTTP_TIMEOUT: 10s
  CART_GRPC_ADDR: cart-service:8083
  WISHLIST_GRPC_ADDR: wishlist-service:8084
  WISHLIST_HTTP_URL: http://wishlist-service:8084
  WISHLIST_HTTP_TIMEOUT: 10s
  ORDER_GRPC_ADDR: order-service:9094
  PAYMENT_GRPC_ADDR: payment-service:8080
  PAYMENT_HTTP_URL: http://payment-service:8080
  PAYMENT_HTTP_TIMEOUT: 10s
  SEARCH_GRPC_ADDR: search-service:9085
  RECOMMENDATION_GRPC_ADDR: recommendation-service:9088
  CMS_GRPC_ADDR: cms-service:9098
  CMS_HTTP_URL: http://cms-service:8087
  CMS_HTTP_TIMEOUT: 10s
  CMS_INTERNAL_AUTH_HEADER: X-Internal-Token
  CMS_INTERNAL_AUTH_TOKEN: ""
  SESSION_GRPC_ADDR: session-service:8086
  SESSION_HTTP_URL: http://session-service:8086
  SESSION_HTTP_TIMEOUT: 30s
  NOTIFICATION_GRPC_ADDR: notification-service:9090
  SUPERADMIN_GRPC_ADDR: superadmin-service:8088
  SUPERADMIN_HTTP_URL: http://superadmin-service:8088
  SUPERADMIN_HTTP_TIMEOUT: 30s
