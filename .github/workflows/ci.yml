name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: "backend/**/go.sum"
      - name: Test every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "::group::$directory"
            (cd "$directory" && go test ./...)
            echo "::endgroup::"
          done < <(find backend -name go.mod -not -path '*/vendor/*' | sort)
      - name: Vet every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do (cd "$(dirname "$module")" && go vet ./...); done < <(find backend -name go.mod -not -path '*/vendor/*' | sort)

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(find backend -name '*.go' -not -path '*/vendor/*'))"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
      - name: Lint every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "::group::$directory"
            (cd "$directory" && golangci-lint run ./...)
            echo "::endgroup::"
          done < <(find backend -name go.mod -not -path '*/vendor/*' | sort)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm --workspace-concurrency=1 -r --if-present test
        working-directory: frontend
      - run: corepack pnpm --workspace-concurrency=1 -r --if-present lint
        working-directory: frontend
      - run: corepack pnpm --workspace-concurrency=1 -r --if-present typecheck
        working-directory: frontend
      - run: corepack pnpm --workspace-concurrency=1 -r --if-present build
        working-directory: frontend

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=dev"
      - name: Verify generated clients are current
        run: |
          buf generate
          git diff --exit-code -- backend/shared/gen/go

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/services/api-gateway/Dockerfile
          - backend/services/auth-service/Dockerfile
          - backend/services/cart-service/Dockerfile
          - backend/services/cms-service/Dockerfile
          - backend/services/notification-service/Dockerfile
          - backend/services/order-service/Dockerfile
          - backend/services/payment-service/Dockerfile
          - backend/services/product-service/Dockerfile
          - backend/services/recommendation-service/Dockerfile
          - backend/services/search-service/Dockerfile
          - backend/services/session-service/Dockerfile
          - backend/services/superadmin-service/Dockerfile
          - backend/services/user-service/Dockerfile
          - backend/services/wishlist-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ecommerce-ci:${{ strategy.job-index }}
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ecommerce-ci:${{ strategy.job-index }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
