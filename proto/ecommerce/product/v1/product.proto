syntax = "proto3";

package ecommerce.product.v1;

option go_package = "github.com/parag/ecommerce/backend/shared/gen/go/ecommerce/product/v1;productv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service ProductService {
  rpc ListProducts(ListProductsRequest) returns (ProductListResponse);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListCategories(ListCategoriesRequest) returns (CategoryListResponse);
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc PublishProduct(ProductLifecycleRequest) returns (Product);
  rpc UnpublishProduct(ProductLifecycleRequest) returns (Product);
  rpc BatchGetProducts(BatchGetProductsRequest) returns (ProductListResponse);
  rpc ReserveInventory(InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc ReleaseInventory(InventoryReservationActionRequest) returns (SuccessResponse);
  rpc CommitInventory(InventoryReservationActionRequest) returns (SuccessResponse);
}

message ActorContext {
  string user_id = 1;
  string seller_id = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
}

message Money {
  int64 amount = 1;
  string currency = 2;
}

message ProductImage {
  string image_id = 1;
  string url = 2;
  string alt_text = 3;
  int32 position = 4;
  bool is_primary = 5;
  repeated string variant_ids = 6;
  int32 width = 7;
  int32 height = 8;
  string status = 9;
}

message ProductVariantInput {
  string sku = 1;
  google.protobuf.Struct attributes = 2;
  Money price = 3;
  Money mrp = 4;
  int64 stock_quantity = 5;
}

message ProductInput {
  string title = 1;
  string description = 2;
  string brand = 3;
  string category_id = 4;
  google.protobuf.Struct attributes = 5;
  repeated ProductImage images = 6;
  repeated ProductVariantInput variants = 7;
}

message ProductVariant {
  string variant_id = 1;
  string sku = 2;
  string title = 3;
  google.protobuf.Struct attributes = 4;
  Money price = 5;
  Money mrp = 6;
  int64 stock_quantity = 7;
  int64 available_quantity = 8;
  string status = 9;
}

message RatingSummary {
  double average = 1;
  int64 count = 2;
}

message Product {
  string product_id = 1;
  string seller_id = 2;
  string title = 3;
  string slug = 4;
  string description = 5;
  string brand = 6;
  string category_id = 7;
  repeated string category_path = 8;
  string status = 9;
  google.protobuf.Struct attributes = 10;
  repeated ProductImage images = 11;
  repeated ProductVariant variants = 12;
  RatingSummary rating_summary = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp published_at = 16;
}

message Category {
  string category_id = 1;
  string name = 2;
  string slug = 3;
  string parent_id = 4;
  repeated string path = 5;
  int32 level = 6;
  int32 sort_order = 7;
}

message ListProductsRequest {
  string category_id = 1;
  string seller_id = 2;
  string status = 3;
  int32 page = 4;
  int32 page_size = 5;
  string sort = 6;
  ActorContext actor = 7;
}

message GetProductRequest {
  string product_id = 1;
  ActorContext actor = 2;
}

message ListCategoriesRequest {
  string parent_id = 1;
}

message ProductListResponse {
  repeated Product products = 1;
  int64 total = 2;
}

message CategoryListResponse {
  repeated Category categories = 1;
}

message CreateProductRequest {
  ActorContext actor = 1;
  ProductInput product = 2;
}

message UpdateProductRequest {
  ActorContext actor = 1;
  string product_id = 2;
  ProductInput product = 3;
}

message ProductLifecycleRequest {
  ActorContext actor = 1;
  string product_id = 2;
}

message BatchGetProductsRequest {
  repeated string product_ids = 1;
}

message InventoryReservationItem {
  string product_id = 1;
  string variant_id = 2;
  int64 quantity = 3;
}

message InventoryReservationRequest {
  string order_id = 1;
  repeated InventoryReservationItem items = 2;
  int32 ttl_seconds = 3;
  string idempotency_key = 4;
}

message InventoryReservationResponse {
  string reservation_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message InventoryReservationActionRequest {
  string reservation_id = 1;
  string reason = 2;
}

message SuccessResponse {
  bool success = 1;
}
